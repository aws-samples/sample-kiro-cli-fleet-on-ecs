[project]
name = "fleetbench"
version = "0.1.0"
description = "Reproduction benchmarks for the Kiro CLI subscription-pool fleet (M1 throttling curve)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT-0" }

# The ramp core is pure standard library on purpose: it is the part that must be
# testable without a network, a credential, or the worker package. The real
# measurement adapter imports the worker lazily (see fleetbench/adapter.py), so it
# is a runtime expectation documented in the README rather than a hard dependency
# resolved here.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleetbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -r a reports the reason for every skip and xfail. A silently skipped ramp test
# would hide the one property this harness exists to measure: where throttling
# begins.
addopts = "-ra --strict-markers --strict-config"
